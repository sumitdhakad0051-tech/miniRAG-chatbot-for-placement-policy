<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNIT Placement Policy Assistant</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 1rem; }
    button { padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: 24px; padding: 16px; background: #f4f4f5; border-radius: 8px; display: none; }
    #sources { margin-top: 12px; font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <h1>MNIT Placement Policy Assistant</h1>
  <form id="form">
    <input id="q" placeholder="Ask about the placement policy..." required />
    <button id="btn" type="submit">Ask</button>
  </form>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const form = document.getElementById("form");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = document.getElementById("q").value;
      btn.disabled = true;
      answerEl.style.display = "block";
      answerEl.textContent = "Thinking...";
      sourcesEl.textContent = "";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        answerEl.textContent = data.answer;
        sourcesEl.textContent = "Sources: " + data.sources
          .map((s) => `${s.section} (page ${s.page})`).join(" | ");
      } catch (err) {
        answerEl.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
